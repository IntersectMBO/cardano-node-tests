exclude: ^(sync_tests/|cardano_node_tests/tests/data/)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    language_version: python3
    exclude_types: [html]
  - id: end-of-file-fixer
    language_version: python3
    exclude_types: [html]
  - id: check-yaml
    language_version: python3
  - id: debug-statements
    language_version: python3
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.6
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1-1
  hooks:
  - id: shellcheck
    # The upstream `types: [shell]` selection relies on `identify`, which tags a file as
    # shell by its extension, or by its shebang only when the file is executable. Scripts
    # that are meant to be sourced are not executable and some of them have no `.sh`
    # extension, so they would be silently skipped. Select the files by path instead, so
    # they all end up in the single `shellcheck` invocation (the hook is `require_serial`
    # upstream, which also lets shellcheck follow `source` between the files).
    # The cluster scripts and the binary mocks are extension-less shell scripts, matched
    # here by their location; `[^./]+` keeps the data files (e.g. `testnet.json`) out.
    types: [text]
    files: |
      (?x)^(
        .*\.(sh|bash)
        |\.source\.dev
        |cardano_node_tests/cluster_scripts/[^/]+/[^./]+
        |(framework_tests|src_docs/source)/mocks/[^./]+
      )$
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
- repo: https://github.com/rstcheck/rstcheck
  rev: v6.3.0
  hooks:
  - id: rstcheck
    additional_dependencies: [sphinx, toml]
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
    # Allow empty-string options in workflow_dispatch `type: choice` lists:
    # we use "" to mean "leave the backend/era at its default".
    args: ['-ignore', 'string should not be empty']
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.0
  hooks:
  - id: zizmor
- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: mypy
    language: system
    types: [python]
    # Run mypy once on all sources instead of letting pre-commit shard the files
    # over parallel processes. mypy 2.x enables the SQLite cache by default,
    # and concurrent processes sharing `.mypy_cache` fail to acquire its lock:
    # `sqlite3.OperationalError: database is locked` surfaces as an intermittent
    # mypy `INTERNAL ERROR`. Sharding is also slower, as every shard re-analyzes
    # the full dependency graph.
    pass_filenames: false
    require_serial: true
    args: [cardano_node_tests, framework_tests, scripts/count_test_results.py, src_docs/source/conf.py]
