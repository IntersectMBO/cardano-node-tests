exclude: ^(sync_tests/|cardano_node_tests/tests/data/)
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    language_version: python3
    exclude_types: [html]
  - id: end-of-file-fixer
    language_version: python3
    exclude_types: [html]
  - id: check-yaml
    language_version: python3
  - id: debug-statements
    language_version: python3
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.6
  hooks:
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1-1
  hooks:
  - id: shellcheck
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
- repo: https://github.com/rstcheck/rstcheck
  rev: v6.3.0
  hooks:
  - id: rstcheck
    additional_dependencies: [sphinx, toml]
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.12
  hooks:
  - id: actionlint
    # Allow empty-string options in workflow_dispatch `type: choice` lists:
    # we use "" to mean "leave the backend/era at its default".
    args: ['-ignore', 'string should not be empty']
- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: v1.30.0
  hooks:
  - id: zizmor
- repo: local
  hooks:
  - id: mypy
    name: mypy
    entry: mypy
    language: system
    types: [python]
