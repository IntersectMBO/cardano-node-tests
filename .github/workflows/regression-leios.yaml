name: 04 Regression tests with Leios

on:
  workflow_dispatch:
    inputs:
      node_rev:
        description: "cardano-node revision"
        required: true
        default: leios-prototype
      cli_rev:
        description: "cardano-cli revision (optional)"
        default: ""
      allow_unstable_error_msgs:
        type: boolean
        default: false
        description: "Allow unstable error messages"

permissions:
  contents: read

jobs:
  regression_tests:
    # reusable workflow from local repo and same branch as this config
    uses: ./.github/workflows/regression_reusable.yaml
    with:
      # Defaulted here as well, because `required: true` is enforced only by the
      # dispatch form - an API or `gh workflow run` dispatch can still pass an
      # empty value, which `regression.sh` would turn into `master`.
      node_rev: ${{ inputs.node_rev || 'leios-prototype' }}
      cli_rev: ${{ inputs.cli_rev }}
      cluster_era: dijkstra 12
      allow_unstable_error_msgs: ${{ inputs.allow_unstable_error_msgs }}
      session_timeout: 4h
      # Only smoke, Leios and Dijkstra tests - with the `leios_fast` testnet variant,
      # the full testrun can exceed the 6h GitHub job limit. Unlike `-m`, `-k` can
      # match the `tests_dijkstra` dir as well as the marker names.
      ci_args: -k "smoke or leios or tests_dijkstra"
      env-path: runner/env_leios
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
